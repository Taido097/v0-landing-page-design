name: Test dedicated ADU Option 1 layout

on:
  push:
    branches:
      - claude/client-demo-8889-concept-1-bh1mpv
    paths:
      - '.github/workflows/test-adu-option1-dedicated.yml'
      - 'app/client-demos/client-8889/residential/services/adus/page.tsx'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ADU wrapper replaces only Scope of Services
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/client-demos/client-8889/residential/services/adus/page.tsx')
          assert p.exists(), 'Dedicated ADU wrapper page is missing'
          text = p.read_text()
          assert 'function AduScopeOptionOne' in text, 'Dedicated ADU Option 1 component is missing'
          assert 'function replaceAduScope' in text, 'ADU scope replacement helper is missing'
          assert 'adu-o1-panel' in text, 'Option 1 panel styles are missing'
          assert "params: Promise.resolve({ slug: 'adus' })" in text, 'Wrapper is not reusing shared ADU page'
          assert "className.includes('nrd-adu-scope')" in text, 'Wrapper is not targeting only the ADU scope section'
          PY
