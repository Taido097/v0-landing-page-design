name: Concept 1 Residential CI

on:
  push:
    branches:
      - feature/concept1-residential-page

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run Residential contract check
        run: npm run check:concept1-residential
      - name: Run production build
        run: npm run build
