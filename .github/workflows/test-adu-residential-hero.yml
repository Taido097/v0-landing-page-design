name: Test ADU residential hero

on:
  push:
    branches:
      - claude/client-demo-8889-concept-1-bh1mpv
    paths:
      - '.github/workflows/test-adu-residential-hero.yml'
      - 'app/client-demos/client-8889/residential/services/services-data.ts'

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify ADU uses shared Residential hero
        run: |
          python - <<'PY'
          from pathlib import Path
          text = Path('app/client-demos/client-8889/residential/services/services-data.ts').read_text()
          start = text.index("slug: 'adus'")
          end = text.index("slug: 'multifamily'", start)
          block = text[start:end]
          assert 'heroBanner: true' in block, 'ADU is not using the shared Residential HeroBanner yet'
          PY
