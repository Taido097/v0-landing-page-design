name: Materialize Custom Home 4K asset

on:
  push:
    paths:
      - '.github/workflows/materialize-custom-home-4k.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Download and verify exact 4K WebP
        env:
          SOURCE_URL: "https://sdmntprwestus3.oaiusercontent.com/files/00000000-40b8-81fd-bd29-7ae64c99d3e0/raw?se=2026-08-28T19%3A52%3A23Z&sp=r&sv=2026-02-06&sr=b&scid=12a880c6-7d6e-5695-b870-196efd340f3b&skoid=1a0ef048-201c-43e0-8950-52d58956a71a&sktid=a48cca56-e6da-484e-a814-9c849652bcb3&skt=2026-08-28T03%3A33%3A56Z&ske=2026-08-29T03%3A33%3A56Z&sks=b&skv=2026-02-06&sig=Ft5xoqVV6xOZCPucsjUNzj3%2BN8PA0Eh206Ge9jtfRAM%3D"
        run: |
          set -euo pipefail
          mkdir -p public/client-8889/residential
          curl --fail --location --silent --show-error "$SOURCE_URL" -o /tmp/house-2-custom-4k.webp
          test "$(wc -c < /tmp/house-2-custom-4k.webp | tr -d ' ')" = "1116206"
          echo "a09a773a311cd8c2e153263a569a561f066d221a82e430d30df91fc171701431  /tmp/house-2-custom-4k.webp" | sha256sum -c -
          mv /tmp/house-2-custom-4k.webp public/client-8889/residential/house-2-custom-4k.webp

      - name: Remove temporary route and bump only target cache key
        run: |
          set -euo pipefail
          rm -f app/client-8889/residential/house-2-custom-4k.webp/route.ts
          rmdir app/client-8889/residential/house-2-custom-4k.webp 2>/dev/null || true
          python - <<'PY'
          from pathlib import Path
          p = Path('app/client-demos/client-8889/arcsphere-socal/route.ts')
          s = p.read_text()
          old = 'custom-home-red-box-4k-20260828-1'
          new = 'custom-home-red-box-4k-20260828-2'
          if old not in s:
              raise SystemExit('Expected target cache key not found; refusing unrelated edit')
          p.write_text(s.replace(old, new, 1))
          PY

      - name: Commit exact static asset
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/client-8889/residential/house-2-custom-4k.webp app/client-8889/residential/house-2-custom-4k.webp/route.ts app/client-demos/client-8889/arcsphere-socal/route.ts
          git commit -m "Store exact 4K Custom Home image as static asset"
          git push origin HEAD:main
