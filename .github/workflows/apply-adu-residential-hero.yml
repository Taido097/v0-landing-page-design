name: Apply ADU residential hero

on:
  push:
    branches:
      - claude/client-demo-8889-concept-1-bh1mpv
    paths:
      - '.github/workflows/apply-adu-residential-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: claude/client-demo-8889-concept-1-bh1mpv
      - name: Enable shared Residential hero for ADU only
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/client-demos/client-8889/residential/services/services-data.ts')
          text = p.read_text()
          start = text.index("slug: 'adus'")
          end = text.index("slug: 'multifamily'", start)
          block = text[start:end]
          if 'heroBanner: true' in block:
              raise SystemExit('ADU already has heroBanner enabled')
          old = "    hero: `${D}/adu-04-golden-hour.jpg`,\n"
          if old not in block:
              raise SystemExit('Expected ADU hero line not found; refusing unrelated edit')
          new_block = block.replace(old, old + "    heroBanner: true,\n", 1)
          p.write_text(text[:start] + new_block + text[end:])
          PY
      - name: Verify only ADU hero flag changed
        run: |
          git diff -- app/client-demos/client-8889/residential/services/services-data.ts
          test "$(git diff --numstat -- app/client-demos/client-8889/residential/services/services-data.ts | awk '{print $1+$2}')" = "1"
          grep -A12 "slug: 'adus'" app/client-demos/client-8889/residential/services/services-data.ts | grep -q "heroBanner: true"
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/client-demos/client-8889/residential/services/services-data.ts
          git commit -m "Use Residential hero on ADU page"
          git push origin HEAD:claude/client-demo-8889-concept-1-bh1mpv
